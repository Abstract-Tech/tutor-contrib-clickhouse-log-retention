# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-contrib-clickhouse-log-retention"
description = "ClickHouse system log retention (TTL, profiler off) for Cairn and Aspects, a plugin for Tutor"
authors = [
  { name = "Emad Ehsanrad"},
  { email = "emad.ehsanrad@gmail.com" },
]
license = { text = "AGPL-3.0-only" }

readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

]
dependencies = [
    "tutor>=14.0.0",
]

# These fields will be set by hatch_build.py
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "tutor[dev]>=14.0.0",
    "ruff",
]

[tool.hatch.version]
path = "tutorclickhouse_log_retention/__about__.py"

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Documentation = "https://github.com/Abstract-Tech/tutor-contrib-clickhouse-log-retention#readme"
Issues = "https://github.com/Abstract-Tech/tutor-contrib-clickhouse-log-retention/issues"
Source = "https://github.com/Abstract-Tech/tutor-contrib-clickhouse-log-retention"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorclickhouse_log_retention"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/tutorclickhouse_log_retention"]
exclude = ["tests*"]

[project.entry-points."tutor.plugin.v1"]
clickhouse-log-retention = "tutorclickhouse_log_retention.plugin"
